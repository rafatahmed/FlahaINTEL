name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@flaha-intel/api
      - name: Package builds
        run: npm run build:packages
      - name: Typecheck / API build
        run: npm run build --workspace=@flaha-intel/api
      - name: Linux Vite native binding
        run: npm i @rolldown/binding-linux-x64-gnu --no-save --no-fund --no-audit
      - name: Web build
        run: npm run build --workspace=@flaha-intel/web
      - name: Prisma validate
        run: npm run prisma:validate --workspace=@flaha-intel/api
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/flaha_intel
      - name: Migration folders present
        run: test -d apps/api/prisma/migrations && test -f apps/api/prisma/migrations/migration_lock.toml
      - name: Lockfile integrity
        run: npm ci --ignore-scripts --dry-run
      - name: Unit tests (API)
        run: npm run test:unit --workspace=@flaha-intel/api
        env:
          AUTH_MODE: development
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/flaha_intel
      - name: Web unit tests
        run: npm run test:web
      - name: Secret scan (basic)
        run: |
          if grep -RInE '(FLAHA_SESSION_SECRET|DATABASE_URL)=["'\'']?(?!postgresql://postgres:<PASSWORD>)(?!REPLACE)[A-Za-z0-9+/=]{20,}' ops apps --include='*.md' --include='*.example' --include='*.env' 2>/dev/null; then
            echo "Possible secret material detected"
            exit 1
          fi
          echo "Basic secret scan passed"
      - name: Package deployment artifact list
        run: |
          mkdir -p dist-ci
          echo "release-placeholder" > dist-ci/MANIFEST.txt
          tar -czf dist-ci/flahaintel-ci-bundle.tgz package.json package-lock.json apps packages ops docs || true

  # Deployment credentials must never be available to untrusted PRs.
  # Production deploy is manual with explicit approval only.
